<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 170" role="img" aria-label="Machine vise in good condition">
  <defs>
    <linearGradient id="steelTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9edf2"/><stop offset="1" stop-color="#b9c1cc"/></linearGradient>
    <linearGradient id="steelFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3cad3"/><stop offset="1" stop-color="#8d96a3"/></linearGradient>
    <linearGradient id="steelSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f98a5"/><stop offset="1" stop-color="#6c7582"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a515b"/><stop offset="1" stop-color="#2b3038"/></linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa3ae"/><stop offset="0.5" stop-color="#d7dce2"/><stop offset="1" stop-color="#8a939f"/></linearGradient>
  </defs>
  <ellipse cx="124" cy="150" rx="112" ry="10" fill="#000" opacity="0.18"/>
  <!-- rail -->
  <polygon points="8,126 216,126 236,112 28,112" fill="#5b636e"/>
  <rect x="8" y="126" width="208" height="12" fill="url(#rail)"/>
  <polygon points="216,126 236,112 236,124 216,138" fill="#262b32"/>
  <!-- base -->
  <polygon points="40,100 170,100 206,75 76,75" fill="url(#steelTop)"/>
  <rect x="40" y="100" width="130" height="28" fill="url(#steelFront)"/>
  <polygon points="170,100 206,75 206,103 170,128" fill="url(#steelSide)"/>
  <circle cx="60" cy="114" r="6" fill="#4b525c"/><circle cx="60" cy="114" r="3.2" fill="#2a2f36"/>
  <circle cx="150" cy="114" r="6" fill="#4b525c"/><circle cx="150" cy="114" r="3.2" fill="#2a2f36"/>
  <!-- fixed jaw (back) -->
  <polygon points="72,56 200,56 210,49 82,49" fill="url(#steelTop)"/>
  <rect x="72" y="56" width="128" height="20" fill="url(#steelFront)"/>
  <polygon points="200,56 210,49 210,69 200,76" fill="url(#steelSide)"/>
  <g fill="#3c434c"><circle cx="104" cy="52.5" r="3.4"/><circle cx="150" cy="52.5" r="3.4"/><circle cx="182" cy="52.5" r="3.4"/></g>
  <g fill="#1f242a"><circle cx="104" cy="52.5" r="1.6"/><circle cx="150" cy="52.5" r="1.6"/><circle cx="182" cy="52.5" r="1.6"/></g>
  <!-- moving jaw (front) -->
  <polygon points="52,78 152,78 166,68 66,68" fill="url(#steelTop)"/>
  <rect x="52" y="78" width="100" height="24" fill="url(#steelFront)"/>
  <polygon points="152,78 166,68 166,92 152,102" fill="url(#steelSide)"/>
  <line x1="52" y1="78.6" x2="152" y2="78.6" stroke="#f6f8fa" stroke-width="1.2" opacity="0.8"/>
  <!-- screw and crank -->
  <circle cx="102" cy="90" r="7" fill="#2a2f36"/>
  <rect x="96" y="90" width="12" height="40" rx="2" fill="#3a4049"/>
  <g stroke="#22272d" stroke-width="1.4"><line x1="96" y1="96" x2="108" y2="94"/><line x1="96" y1="102" x2="108" y2="100"/><line x1="96" y1="108" x2="108" y2="106"/><line x1="96" y1="114" x2="108" y2="112"/><line x1="96" y1="120" x2="108" y2="118"/></g>
  <rect x="93" y="126" width="18" height="10" rx="3" fill="#59616c"/>
  <path d="M102 134 L84 166" stroke="url(#grip)" stroke-width="12" stroke-linecap="round"/>
  <!-- the good sign -->
  <circle cx="214" cy="28" r="15" fill="#16a34a"/>
  <path d="M206 28 l6 6 l10 -12" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
